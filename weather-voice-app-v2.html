<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

  :root{
    --sky-top:#3E7CB1;
    --sky-bot:#0F2C46;
    --sun:#FDB44B;
    --sun-soft:#FFE7BE;
    --card:#12314E;
    --card-line:rgba(255,255,255,0.12);
    --ink:#F2F7FB;
    --ink-dim:#AFC4D6;
    --ring:#FDB44B;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--sun-soft) 0%, transparent 45%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 78%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }

  .app{
    width:100%;
    max-width:380px;
  }

  .place{
    text-align:center;
    margin-bottom:22px;
  }
  .place .city{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .place .date{
    font-size:14px;
    color:var(--ink-dim);
    margin-top:2px;
  }

  .tabs{
    display:flex;
    gap:8px;
    background:rgba(255,255,255,0.08);
    border-radius:999px;
    padding:4px;
    margin-bottom:22px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 0;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    color:var(--ink-dim);
    cursor:pointer;
    transition:background .25s ease, color .25s ease;
    user-select:none;
  }
  .tab.active{
    background:var(--sun);
    color:#33220a;
  }

  .style-tabs{
    margin-top:-12px;
    margin-bottom:26px;
  }
  .style-tabs .tab{
    font-size:13px;
    padding:8px 0;
  }

  .voice-picker{
    margin-bottom:26px;
  }
  .voice-picker .label{
    font-size:12px;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .voice-picker select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:14px;
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    font-size:14px;
    font-weight:600;
    padding:12px 40px 12px 14px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23AFC4D6'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
    background-size:20px;
  }
  .voice-picker select:focus{
    outline:2px solid var(--sun);
    outline-offset:2px;
  }

  .summary{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:24px;
    padding:22px 20px;
    margin-bottom:26px;
  }
  .summary-top{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .icon{width:56px;height:56px;flex:none;}
  .temps{flex:1;}
  .temp-main{
    font-size:38px;
    font-weight:800;
    line-height:1;
  }
  .phrase{
    font-size:14px;
    color:var(--ink-dim);
    margin-top:4px;
  }
  .divider{
    height:1px;
    background:var(--card-line);
    margin:18px 0;
  }
  .rows{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .row-item .label{
    font-size:12px;
    color:var(--ink-dim);
  }
  .row-item .value{
    font-size:15px;
    font-weight:600;
    margin-top:2px;
  }

  .listen-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .listen-btn{
    position:relative;
    width:118px;
    height:118px;
    border-radius:50%;
    border:none;
    background:radial-gradient(circle at 35% 30%, #FFE3A3, var(--sun) 65%);
    box-shadow:0 10px 30px rgba(253,180,75,0.35);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .15s ease;
  }
  .listen-btn:active{transform:scale(0.96);}
  .listen-btn svg{width:42px;height:42px;fill:#33220a;}

  .listen-btn::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:2px solid var(--ring);
    opacity:0;
  }
  .listen-btn.speaking::before{
    opacity:1;
    animation:pulse 1.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(1);opacity:.6;}
    100%{transform:scale(1.35);opacity:0;}
  }

  .listen-label{
    font-size:14px;
    font-weight:600;
    color:var(--ink-dim);
  }

  .note{
    text-align:center;
    font-size:12px;
    color:var(--ink-dim);
    margin-top:22px;
    line-height:1.5;
  }

  @media (prefers-reduced-motion: reduce){
    .listen-btn.speaking::before{animation:none;opacity:.5;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="place">
    <div class="city">Одесса</div>
    <div class="date" id="dateLabel">—</div>
  </div>

  <div class="tabs">
    <div class="tab day-tab active" data-day="0">Сегодня</div>
    <div class="tab day-tab" data-day="1">Завтра</div>
  </div>

  <div class="tabs style-tabs">
    <div class="tab style-tab" data-style="short">Кратко</div>
    <div class="tab style-tab active" data-style="detailed">Подробно</div>
    <div class="tab style-tab" data-style="friendly">По-дружески</div>
  </div>

  <div class="summary" id="summary">
    <!-- filled by JS -->
  </div>

  <div class="voice-picker">
    <div class="label">Голос</div>
    <select id="voiceSelect"><option>Загрузка голосов…</option></select>
  </div>

  <div class="listen-wrap">
    <button class="listen-btn" id="listenBtn" aria-label="Озвучить прогноз">
      <svg viewBox="0 0 24 24"><path d="M12 3a1 1 0 0 0-1 1v2.06A7.002 7.002 0 0 0 5 13v3.09c0 .35-.15.68-.4.92L3 18.5V19a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-.5l-1.6-1.49a1.26 1.26 0 0 1-.4-.92V13a7.002 7.002 0 0 0-6-6.94V4a1 1 0 0 0-1-1Zm-1.5 17a1.5 1.5 0 0 0 3 0Z"/></svg>
    </button>
    <div class="listen-label" id="listenLabel">Нажмите, чтобы услышать прогноз</div>
  </div>

  <div class="note">Данные предоставлены AccuWeather®.</div>
</div>

<script>
  // Forecast data pulled from AccuWeather for Odesa (locationKey 325343)
  const forecast = [
    {
      dateLabel: "Сегодня",
      dayNumberLabel: "",
      dayTemp: 24, nightTemp: 19,
      dayPhrase: "Солнечно, облачно с прояснениями",
      nightPhrase: "Ясно",
      dayWind: "южный, 5 м/с",
      nightWind: "юго-западный, 3 м/с",
      dayPrecip: 1, nightPrecip: 3
    },
    {
      dateLabel: "Завтра",
      dayNumberLabel: "",
      dayTemp: 24, nightTemp: 20,
      dayPhrase: "Солнечно, облачно с прояснениями",
      nightPhrase: "Переменная облачность",
      dayWind: "западный, 4 м/с",
      nightWind: "юго-юго-западный, 3 м/с",
      dayPrecip: 6, nightPrecip: 4
    }
  ];

  // Дата берётся из системных часов телефона в момент открытия —
  // "Сегодня" и "Завтра" всегда показывают настоящую текущую дату.
  (function setLiveDates(){
    const fmt = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long' });
    const now = new Date();
    const tomorrow = new Date(now);
    tomorrow.setDate(now.getDate() + 1);

    const todayStr = fmt.format(now);
    const tomorrowStr = fmt.format(tomorrow);

    forecast[0].dayNumberLabel = todayStr;
    forecast[0].dateLabel = `Сегодня, ${todayStr}`;
    forecast[1].dayNumberLabel = tomorrowStr;
    forecast[1].dateLabel = `Завтра, ${tomorrowStr}`;
  })();

  function pluralRu(n, forms){
    // forms = [один, два-четыре, пять-и-более/одиннадцать-четырнадцать]
    const abs = Math.abs(n) % 100;
    const last = abs % 10;
    if(abs > 10 && abs < 20) return forms[2];
    if(last > 1 && last < 5) return forms[1];
    if(last === 1) return forms[0];
    return forms[2];
  }

  function numberToWordsRu(n){
    // Числа произносятся словами, а не цифрами — чтобы синтезатор речи
    // не путал форму (например, "1" как порядковое "первый").
    const ones = ['ноль','один','два','три','четыре','пять','шесть','семь','восемь','девять'];
    const teens = ['десять','одиннадцать','двенадцать','тринадцать','четырнадцать','пятнадцать','шестнадцать','семнадцать','восемнадцать','девятнадцать'];
    const tens = ['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];

    if(n < 0) return `минус ${numberToWordsRu(-n)}`;
    if(n < 10) return ones[n];
    if(n < 20) return teens[n - 10];
    if(n < 100){
      const t = Math.floor(n / 10), o = n % 10;
      return o === 0 ? tens[t] : `${tens[t]} ${ones[o]}`;
    }
    if(n === 100) return 'сто';
    // На случай неожиданно больших значений — не должно встречаться в прогнозе
    return String(n);
  }

  function degreesText(n){
    return `${numberToWordsRu(n)} ${pluralRu(n, ['градус', 'градуса', 'градусов'])}`;
  }

  function percentText(n){
    return `${numberToWordsRu(n)} ${pluralRu(n, ['процент', 'процента', 'процентов'])}`;
  }

  function windSpeechText(windStr){
    // "южный, 5 м/с" -> "южный, пять метров в секунду" с правильным окончанием
    const match = windStr.match(/(\d+)\s*м\/с/);
    if(!match) return windStr;
    const n = parseInt(match[1], 10);
    const unit = pluralRu(n, ['метр в секунду', 'метра в секунду', 'метров в секунду']);
    return windStr.replace(/\d+\s*м\/с/, `${numberToWordsRu(n)} ${unit}`);
  }

  function buildSpeech(dayIndex, style){
    const f = forecast[dayIndex];
    const when = dayIndex === 0 ? 'сегодня' : 'завтра';
    const needUmbrella = f.dayPrecip >= 20 || f.nightPrecip >= 20;

    if(style === 'short'){
      return `Одесса, ${f.dayNumberLabel}. Днём ${degreesText(f.dayTemp)}, ${f.dayPhrase.toLowerCase()}. Ночью ${degreesText(f.nightTemp)}.`;
    }

    if(style === 'friendly'){
      const advice = needUmbrella ? 'Возьмите с собой зонт.' : 'Зонт сегодня не понадобится.';
      return `Привет! В Одессе ${when} ${f.dayPhrase.toLowerCase()}, воздух прогреется до ${degreesText(f.dayTemp)}, ветер ${windSpeechText(f.dayWind)}. ${advice} А ночью станет прохладнее, около ${degreesText(f.nightTemp)}, ${f.nightPhrase.toLowerCase()}. Хорошего дня!`;
    }

    // detailed (default)
    const minTemp = Math.min(f.dayTemp, f.nightTemp);
    const maxTemp = Math.max(f.dayTemp, f.nightTemp);
    const windSpeedMatch = f.dayWind.match(/(\d+)/);
    const windSpeedNum = windSpeedMatch ? parseInt(windSpeedMatch[1], 10) : null;
    const windSpeedText = windSpeedNum !== null
      ? `${numberToWordsRu(windSpeedNum)} ${pluralRu(windSpeedNum, ['метр в секунду', 'метра в секунду', 'метров в секунду'])}`
      : f.dayWind;
    return `Погода на ${when}, ${f.dayNumberLabel}. Минимальная температура воздуха ${degreesText(minTemp)}, максимальная температура воздуха ${degreesText(maxTemp)}. Ветер ${windSpeedText}. ${f.dayPhrase}. Вероятность осадков ${percentText(f.dayPrecip)}.`;
  }

  const sunIcon = `<svg class="icon" viewBox="0 0 64 64"><circle cx="32" cy="32" r="14" fill="#FDB44B"/><g stroke="#FDB44B" stroke-width="4" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="60"/><line x1="4" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="60" y2="32"/><line x1="12" y1="12" x2="18" y2="18"/><line x1="46" y1="46" x2="52" y2="52"/><line x1="12" y1="52" x2="18" y2="46"/><line x1="46" y1="18" x2="52" y2="12"/></g></svg>`;
  const moonIcon = `<svg class="icon" viewBox="0 0 64 64"><path d="M40 8a24 24 0 1 0 16 42 20 20 0 0 1-16-42Z" fill="#DCE8F3"/><circle cx="46" cy="14" r="2" fill="#DCE8F3"/><circle cx="52" cy="24" r="1.4" fill="#DCE8F3"/></svg>`;

  let currentDay = 0;
  let currentStyle = 'detailed';
  let speaking = false;

  const summaryEl = document.getElementById('summary');
  const voiceSelect = document.getElementById('voiceSelect');
  let selectedVoiceURI = null;

  function populateVoices(){
    const voices = window.speechSynthesis.getVoices();
    if(!voices.length) return;

    // Русские голоса — первыми в списке, остальные — ниже, на случай
    // если на устройстве не установлен ни один русский голос.
    const ru = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
    const other = voices.filter(v => !(v.lang && v.lang.toLowerCase().startsWith('ru')));
    const ordered = [...ru, ...other];

    voiceSelect.innerHTML = ordered.map(v =>
      `<option value="${v.voiceURI}">${v.name}${v.lang ? ' — ' + v.lang : ''}</option>`
    ).join('');

    if(!selectedVoiceURI && ru.length){
      selectedVoiceURI = ru[0].voiceURI;
    } else if(!selectedVoiceURI && ordered.length){
      selectedVoiceURI = ordered[0].voiceURI;
    }
    voiceSelect.value = selectedVoiceURI;
  }

  voiceSelect.addEventListener('change', () => {
    selectedVoiceURI = voiceSelect.value;
  });
  const dateLabelEl = document.getElementById('dateLabel');
  const listenBtn = document.getElementById('listenBtn');
  const listenLabel = document.getElementById('listenLabel');
  const dayTabs = document.querySelectorAll('.day-tab');
  const styleTabs = document.querySelectorAll('.style-tab');

  function render(){
    const f = forecast[currentDay];
    dateLabelEl.textContent = f.dateLabel;
    summaryEl.innerHTML = `
      <div class="summary-top">
        ${sunIcon}
        <div class="temps">
          <div class="temp-main">${f.dayTemp}° <span style="font-size:20px;color:var(--ink-dim);font-weight:600;">/ ${f.nightTemp}°</span></div>
          <div class="phrase">${f.dayPhrase}</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="rows">
        <div class="row-item">
          <div class="label">Ветер днём</div>
          <div class="value">${f.dayWind}</div>
        </div>
        <div class="row-item">
          <div class="label">Осадки днём</div>
          <div class="value">${f.dayPrecip}%</div>
        </div>
        <div class="row-item">
          <div class="label">Ночью</div>
          <div class="value">${f.nightPhrase}, ${f.nightTemp}°</div>
        </div>
        <div class="row-item">
          <div class="label">Осадки ночью</div>
          <div class="value">${f.nightPrecip}%</div>
        </div>
      </div>
    `;
  }

  dayTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      dayTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentDay = Number(tab.dataset.day);
      render();
    });
  });

  styleTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      styleTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentStyle = tab.dataset.style;
    });
  });

  function speak(){
    if(!('speechSynthesis' in window)){
      listenLabel.textContent = 'Озвучивание не поддерживается в этом браузере';
      return;
    }
    if(speaking){
      window.speechSynthesis.cancel();
      return;
    }
    const utter = new SpeechSynthesisUtterance(buildSpeech(currentDay, currentStyle));
    utter.lang = 'ru-RU';
    utter.rate = 0.85;

    const voices = window.speechSynthesis.getVoices();
    const chosen = voices.find(v => v.voiceURI === selectedVoiceURI);
    const ruVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('ru'));
    utter.voice = chosen || ruVoice || null;

    utter.onstart = () => {
      speaking = true;
      listenBtn.classList.add('speaking');
      listenLabel.textContent = 'Озвучиваю прогноз…';
    };
    utter.onend = utter.onerror = () => {
      speaking = false;
      listenBtn.classList.remove('speaking');
      listenLabel.textContent = 'Нажмите, чтобы услышать прогноз';
    };

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  // Некоторые браузеры подгружают список голосов асинхронно
  if('speechSynthesis' in window){
    populateVoices();
    window.speechSynthesis.onvoiceschanged = populateVoices;
  }

  listenBtn.addEventListener('click', speak);

  // Из-за ограничений iOS/Android браузер часто блокирует автозапуск озвучки
  // без прямого касания экрана пользователем. Поэтому первое касание
  // в любом месте экрана (кроме переключателей дня/стиля и списка голосов)
  // сразу запускает озвучивание — это самый надёжный аналог
  // "нажал на иконку — сразу услышал прогноз", который поддерживают браузеры.
  let firstTapHandled = false;
  function firstTapSpeak(e){
    if(firstTapHandled) return;
    if(e.target.closest('#listenBtn')) return; // у кнопки уже есть свой обработчик
    if(e.target.closest('.tabs') || e.target.closest('#voiceSelect')) return; // не мешаем выбору настроек
    firstTapHandled = true;
    document.removeEventListener('click', firstTapSpeak);
    if(!speaking) speak();
  }
  document.addEventListener('click', firstTapSpeak);

  render();

  // Автоматически озвучиваем прогноз сразу при открытии ярлыка.
  // На iOS первый запуск речи иногда требует любого касания экрана —
  // если автозапуск не сработал, первое касание экрана (см. выше) и кнопка
  // остаются рабочими как обычная озвучка по нажатию.
  function autoSpeak(){
    if(!('speechSynthesis' in window)) return;
    speak();
  }
  if(document.readyState === 'complete'){
    setTimeout(autoSpeak, 400);
  } else {
    window.addEventListener('load', () => setTimeout(autoSpeak, 400));
  }
  // Резервный запуск на случай, если голоса подгрузились с задержкой
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && !speaking && window.speechSynthesis.paused === false && window.speechSynthesis.speaking === false){
      // ничего — не запускаем повторно при обычном сворачивании/разворачивании
    }
  });
</script>

</body>
</html>
